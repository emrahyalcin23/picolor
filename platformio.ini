; ============================================================
; PiColor — PlatformIO Yapılandırması
; ============================================================
; Versiyon kilitleme politikası:
;   - platform: git tag ile sabitlendi (BTstackLib bu versiyonla gelir)
;   - platform_packages: arduino-pico core tam sürümü sabitlendi
;   - lib_deps: ^ veya ~ KULLANILMADI — tam sürüm numarası zorunlu
;
; Herhangi bir versiyonu güncellemeden önce BLE/WiFi testlerini
; çalıştırın. BTstackLib API'si core versiyonları arasında
; breaking change içerebilir (bkz. PiColor.ino BLE bölümü).
; ============================================================

[env:rpipicow]
; Platform wrapper — sabitlenmiş git tag
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git#v1.13.0

; arduino-pico core — platform_packages ile ikinci katman kilitleme.
; Bu sayede platform wrapper güncel kalsa bile core değişmez.
platform_packages =
    framework-arduinopico @ https://github.com/earlephilhower/arduino-pico.git#5.6.0

board     = rpipicow
framework = arduino

; BT Stack: IPv4 + Bluetooth (BLE dahil)
; Arduino IDE karşılığı: Tools → IP/Bluetooth Stack → IPv4 + Bluetooth
board_build.arduino.earlephilhower.ip_bluetooth_stack = ipv4bt

; Kütüphaneler — tam sürüm, semver aralığı yok
; ^ veya ~ EKLEMEYIN: farklı kullanıcılarda farklı sürüm indirilir
lib_deps =
    adafruit/Adafruit TCS34725 @ 1.4.0
    adafruit/Adafruit NeoPixel @ 1.12.0
